services:
  db:
    image: timescale/timescaledb-ha:pg16-latest
    environment:
      POSTGRES_USER: arcshield
      POSTGRES_PASSWORD: arcshield
      POSTGRES_DB: arcshield
    volumes:
      - pgdata:/home/postgres/pgdata/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcshield -d arcshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_frames:/data/media/frames
    environment:
      POSTGRES_URL: postgresql+asyncpg://arcshield:arcshield@db:5432/arcshield

volumes:
  pgdata:
  media_frames:
